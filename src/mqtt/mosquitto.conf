# Mosquitto 2.x configuration for ESP32-C3 telemetry
# Verified against eclipse-mosquitto:2 defaults; only 2.x-safe directives used.

# ---- listeners -----------------------------------------------------------
# LAN access for ESP32-C3 / phone clients (1883 is the only port opened to LAN).
listener 1883 0.0.0.0
protocol mqtt

# ---- authentication ------------------------------------------------------
# Anonymous access is allowed so the ESP32 can connect without a broker login.
# Flip to false once you set a password file.
allow_anonymous true

# Uncomment after creating /mosquitto/data/passwd via:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd <user>
# password_file /mosquitto/data/passwd

# ---- persistence ---------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ---- logging -------------------------------------------------------------
# Both sinks on purpose: stdout keeps startup/config-parse failures visible in
# `docker logs` even when the file target has not been opened yet.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---- misc ----------------------------------------------------------------
max_queued_messages 1000
message_size_limit 0