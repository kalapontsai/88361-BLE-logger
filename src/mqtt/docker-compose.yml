name: mqtt

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt-mosquitto
    restart: unless-stopped
    # 加入與 mysql / apache 共用的網路，讓 worker 能用「mqtt-mosquitto」服務名稱連線。
    # 先前此服務沒有 networks 設定，跨 container 無法互通。
    networks:
      mynet:
        ipv4_address: 172.30.0.20
    ports:
      - "0.0.0.0:1883:1883"
    environment:
      MOSQUITTO_VERSION: "2"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# 與 mysql/apache 共用同一個實際網路（name: espnet）。
# 三邊都必須宣告同名 network，compose 才會把它們合併，
# 這是跨 compose 檔案讓服務互相以名稱解析的標準做法。
networks:
  mynet:
    name: apache_mynet
    external: true